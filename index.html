<style>
:root{--bg:#F4F6FB;--card:#fff;--ink:#1B2340;--mut:#68718F;--line:#DDE2F0;--maiz:#FFC83D;--aji:#E8503A;--ok:#2E9E6B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12172B;--card:#1C2340;--ink:#EEF1FB;--mut:#9AA3C4;--line:#2D365C}}
:root[data-theme="dark"]{--bg:#12172B;--card:#1C2340;--ink:#EEF1FB;--mut:#9AA3C4;--line:#2D365C}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 'DM Sans',system-ui,sans-serif}
h1,h2,.big{font-family:'Baloo 2',system-ui,sans-serif;margin:0}
#app{max-width:440px;margin:0 auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
header h1{font-size:28px;font-weight:800}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px}
.hero{background:var(--ink);color:#fff;border-radius:26px;padding:26px 20px;text-align:center}
.hero h2{font-size:26px;font-weight:800;line-height:1.15}
.hero p{color:#c9d0ee;margin:8px 0 18px}
.cam{width:100%;border:0;border-radius:18px;padding:18px;background:var(--maiz);color:#2b2100;font:800 19px 'Baloo 2',sans-serif;cursor:pointer}
.cam:focus-visible,.btn:focus-visible,button:focus-visible{outline:3px solid var(--aji);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.mut{color:var(--mut);font-size:14px}
.h{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink);font:inherit}
.h:last-child{border-bottom:0}
.h img{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--line)}
.h b{display:block}.h .k{margin-left:auto;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(10,14,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--bg);width:100%;max-width:440px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.photo{width:100%;height:170px;object-fit:cover;border-radius:18px;margin-bottom:12px}
.ringw{display:flex;align-items:center;gap:16px}
.ringw svg{width:120px;height:120px;flex:none}
.m{margin:10px 0}.m .t{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:9px}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font:700 17px 'DM Sans',sans-serif;background:var(--ink);color:var(--bg);cursor:pointer;margin-top:12px}
.btn.maiz{background:var(--maiz);color:#2b2100}.btn.gh{background:transparent;border:1.5px solid var(--line);color:var(--mut)}
.score{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:800;color:#fff}
ul.f{list-style:none;padding:0;margin:12px 0}ul.f li{padding:5px 0 5px 26px;position:relative}ul.f li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}
.spin{width:44px;height:44px;border:5px solid var(--line);border-top-color:var(--aji);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
/* Fase 1: dashboard */
#app{padding-bottom:220px}
.kcal-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;margin-top:4px}
.kcal-titulo{font-weight:700;font-size:15px;color:var(--mut);margin-bottom:12px}
.kcal-ring{width:150px;height:150px;margin:0 auto;display:block}
.kcal-num{font:800 40px 'Baloo 2',sans-serif;margin-top:6px}
.kcal-total{font:600 15px 'DM Sans',sans-serif;color:var(--mut)}
.macros{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.mac{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
.mac-label{font-size:12px;font-weight:700;color:var(--mut);display:block}
.mac-num{font-size:13px;font-weight:700;display:block;margin:4px 0 6px}
.empty{text-align:center;padding:22px 10px;color:var(--mut)}
.empty .e{font-size:34px;display:block;margin-bottom:8px}
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12px 'DM Sans',sans-serif;color:var(--mut);cursor:pointer}
.bnav button.on{color:#f5b800}
.bnav button:disabled{opacity:.45;cursor:not-allowed}
.bnav .ico{font-size:22px}
.fab{position:fixed;right:max(20px,calc((100vw - 440px)/2 + 20px));bottom:calc(100px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border:0;border-radius:50%;background:#f5b800;color:#2b2100;font-size:26px;cursor:pointer;box-shadow:0 8px 20px -6px rgba(0,0,0,.35);z-index:30;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.95)}
.kcal-card,.mac,.card{background:#fff;color:#1a2b4a}
.mac .bar{background:#e0e4eb}
@media (max-width:520px){.fab{bottom:calc(110px + env(safe-area-inset-bottom,0px))}}
@media (min-width:768px){#app{padding-bottom:140px}}
/* Fase 2: flujo de escaneo */
.scanov{text-align:center;padding:26px 10px}
.scanbox{position:relative;width:150px;height:150px;margin:0 auto 18px;border-radius:24px;overflow:hidden;background:#1a2b4a}
.scanbox .plate{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px}
.scanbox .beam{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#f5b800,transparent);box-shadow:0 0 18px 2px #f5b800;animation:beam 1.8s ease-in-out infinite}
@keyframes beam{0%,100%{top:6%}50%{top:94%}}
@media (prefers-reduced-motion:reduce){.scanbox .beam{animation:none;top:50%}}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.rmac{background:#fff;border:1px solid #e0e4eb;border-radius:14px;padding:12px 14px}
.rmac .v{font:800 22px 'Baloo 2',sans-serif;color:#1a2b4a}
.rmac .v small{font:600 13px 'DM Sans',sans-serif;color:#68718F}
.rmac .n{font-size:12.5px;font-weight:700;color:#68718F}
.rmac .bar{height:7px;background:#e0e4eb;border-radius:7px;overflow:hidden;margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{background:#fff;border:1px solid #e0e4eb;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:#1a2b4a}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom,0px));background:#1a2b4a;color:#fff;padding:11px 20px;border-radius:99px;font-weight:700;font-size:14px;box-shadow:0 8px 24px -6px rgba(0,0,0,.4);z-index:60;animation:toast 2.4s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
/* Fase 3: onboarding */
.obwrap{max-width:360px;margin:0 auto}
.ob-hero{background:var(--ink);color:#fff;border-radius:24px;padding:24px 20px;text-align:center;margin-bottom:18px}
.ob-hero h2{font-size:24px;font-weight:800;line-height:1.15}
.ob-hero p{color:#c9d0ee;margin:8px 0 0;font-size:14px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field .unit{color:var(--mut);font-weight:600;font-size:13px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font:600 17px 'DM Sans',sans-serif;background:var(--card);color:var(--ink)}
.field input:focus{outline:none;border-color:var(--maiz)}
.field ::placeholder{color:var(--mut);font-weight:400}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line);border-radius:14px;padding:11px;background:var(--card);color:var(--ink);font:700 14px 'DM Sans',sans-serif;cursor:pointer}
.seg button.on{background:var(--maiz);color:#2b2100;border-color:var(--maiz)}
.sugg{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--mut)}
.sugg b{color:var(--ink)}
</style></head>
<body><div id="app"></div><div id="ov"></div>
<input type="file" id="f" accept="image/*" hidden>
<nav class="bnav" id="bnav" aria-label="Navegación"><button class="on" id="navhome" type="button"><span class="ico">🏠</span>Inicio</button><button type="button" id="navprog" disabled><span class="ico">📊</span>Progreso</button><button type="button" id="navperfil"><span class="ico">👤</span>Perfil</button></nav>
<button class="fab" id="fab" type="button" aria-label="Escanear mi plato">📷</button>
<script>
/* ===== CONFIG ===== */
const API_URL='https://platoscan-api.konfiozinc.workers.dev';           // Worker de PlatoScan (Gemini)
const FREE=3;               // escaneos gratis por día
// Firebase Auth (anónimo). La apiKey NO es un secreto: es el identificador
// público de la app; la seguridad de Firebase está en las reglas, no en la key.
const FIREBASE_CONFIG={apiKey:"AIzaSyBEA3yFtrnEjx79o9cVcthIN79deES6Ew4",authDomain:"platoscan-3249f.firebaseapp.com",projectId:"platoscan-3249f",storageBucket:"platoscan-3249f.firebasestorage.app",messagingSenderId:"587218545630",appId:"1:587218545630:web:1358a99f35d13fba830b4f"};
let UID=null;               // uid anónimo de Firebase = identidad real. null = fallback con device
/* ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeTh=t=>String(t??'').startsWith('data:image/')?t:'';   // la miniatura vive en localStorage (origin compartido): solo data:image, nunca código
const today=()=>new Date().toISOString().slice(0,10);
let S={dev:(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()),pro:false,day:today(),used:0,hist:[]};
try{const x=JSON.parse(localStorage.getItem('ps')||'null');if(x)S=Object.assign(S,x)}catch(e){}
if(S.day!==today()){S.day=today();S.used=0}
const save=()=>{try{localStorage.setItem('ps',JSON.stringify(S))}catch(e){}};
const left=()=>S.pro?'∞':Math.max(0,FREE-S.used);
/* ===== Fase 3: perfil de usuario (onboarding) ===== */
const PROF_KEY='platoscan-perfil';
function loadProf(){try{const p=JSON.parse(localStorage.getItem(PROF_KEY)||'null');return(p&&typeof p==='object'&&p.peso&&p.altura&&p.edad&&p.meta)?p:null}catch(e){return null}}
let PROF=loadProf();
function saveProf(){try{localStorage.setItem(PROF_KEY,JSON.stringify(PROF))}catch(e){toast('No se pudo guardar el perfil')}}
const META=()=>PROF?{kcal:PROF.meta,prot:Math.round(PROF.meta*0.2/4),carbs:Math.round(PROF.meta*0.5/4),grasa:Math.round(PROF.meta*0.3/9)}:{kcal:2000,prot:100,carbs:250,grasa:70};
const imc=()=>PROF?PROF.peso/Math.pow(PROF.altura/100,2):null;
/* ===== Fase 2: historial persistido (clave platoscan-scans) ===== */
const SCANS_KEY='platoscan-scans';
function loadScans(){try{const a=JSON.parse(localStorage.getItem(SCANS_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
let SCANS=loadScans();
function saveScans(){
  let a=SCANS.slice(0,30);                  // cap 30 escaneos
  try{
    let s=JSON.stringify(a);
    while(s.length>4*1024*1024&&a.length>1){a=a.slice(0,-1);s=JSON.stringify(a)}  // evacuar más viejos si >4MB
    localStorage.setItem(SCANS_KEY,s);SCANS=a;
  }catch(e){                                  // almacenamiento lleno: guardar sin fotos
    try{const slim=a.map(x=>({...x,foto:'',th:''}));localStorage.setItem(SCANS_KEY,JSON.stringify(slim));SCANS=slim}
    catch(e2){toast('No se pudo guardar (almacenamiento lleno)')}
  }
}
const dayOf=s=>s&&s.timestamp?new Date(s.timestamp).toISOString().slice(0,10):null;
function racha(){
  const days=new Set(SCANS.map(dayOf).filter(Boolean));
  if(!days.size)return 0;
  let n=0;const d=new Date();
  if(!days.has(today()))d.setDate(d.getDate()-1);   // hoy sin escaneo: partir de ayer (mantiene, no suma)
  while(days.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function home(){
 const M=META(),C=2*Math.PI*50;
 document.getElementById('fab').style.display='';document.getElementById('bnav').style.display='';
 document.getElementById('navhome').classList.add('on');document.getElementById('navperfil').classList.remove('on');
 const hoy=SCANS.filter(s=>dayOf(s)===today());
 const sum=k=>hoy.reduce((a,s)=>a+(+s[k]||0),0);
 const kcal=sum('calorias'),prot=sum('proteina'),carbos=sum('carbos'),grasa=sum('grasa');
 const pct=Math.min(1,kcal/M.kcal),over=kcal>M.kcal;
 const macros=[{n:'Proteína',v:prot,meta:M.prot,c:'#ef4444'},{n:'Carbos',v:carbos,meta:M.carbs,c:'#f59e0b'},{n:'Grasa',v:grasa,meta:M.grasa,c:'#10b981'}];
 const ult=hoy.slice(0,3);
 $('#app').innerHTML=`<header><div style="display:flex;align-items:center;gap:10px"><img src="icons/icon-192.webp" alt="PlatoScan" width="34" height="34" style="border-radius:9px"><h1>PlatoScan</h1></div><span class="pill" title="Racha de días escaneando">🔥 ${racha()}</span></header>
 <div class="kcal-card"><div class="kcal-titulo">Calorías restantes</div><svg class="kcal-ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="#e0e4eb" stroke-width="12"/><circle cx="60" cy="60" r="50" fill="none" stroke="${over?'#ef4444':'#f5b800'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 60 60)"/></svg><div class="kcal-num">${Math.round(kcal)}<span class="kcal-total"> / ${M.kcal.toLocaleString('es-CO')} kcal</span></div>${over?'<div class="mut" style="margin-top:2px">Superaste tu meta de hoy</div>':''}</div>
 <div class="macros">${macros.map(m=>`<div class="mac"><span class="mac-label">${m.n}</span><span class="mac-num">${Math.round(m.v)}/${m.meta}g</span><div class="bar"><i style="width:${Math.min(100,Math.round(m.v/m.meta*100))}%;background:${m.c}"></i></div></div>`).join('')}</div>
 <div class="card"><b>Últimos escaneos</b>${ult.length?ult.map((s,i)=>`<button class="h" data-i="${i}"><img src="${esc(safeTh(s.th))}" alt=""><span><b>${esc(s.plato)}</b><span class="mut">${esc(s.ingredientes&&s.ingredientes.length?s.ingredientes.length+' ingredientes':'')}</span></span><span class="k">${Math.round(s.calorias)} kcal</span></button>`).join(''):'<div class="empty"><span class="e">📷</span>No has escaneado nada<br><span class="mut">Toca el botón + para empezar</span></div>'}</div>
 <p class="mut" style="text-align:center">Valores estimados. No reemplazan la consulta con un nutricionista.</p>
 <p style="text-align:center;margin-top:16px;font-size:13px"><a href="privacidad.html" style="color:var(--mut);text-decoration:underline">Política de Privacidad</a></p>`;
 document.querySelectorAll('.h').forEach(b=>b.onclick=()=>{const s=ult[+b.dataset.i];if(s)detalle(s)});
}
function onboarding(edit){
 document.getElementById('fab').style.display='none';document.getElementById('bnav').style.display='none';
 document.getElementById('navhome').classList.remove('on');document.getElementById('navperfil').classList.add('on');
 const p=PROF||{sexo:'',peso:'',altura:'',edad:'',meta:''};
 $('#app').innerHTML=`<div class="obwrap">
 <div class="ob-hero"><h2>${edit?'Tu perfil':'Bienvenido a PlatoScan 🥗'}</h2><p>${edit?'Actualiza tus datos para metas precisas.':'Cuéntanos de ti para personalizar tu meta calórica y macros.'}</p></div>
 <div class="field"><label>Sexo</label><div class="seg"><button type="button" id="segH" class="${p.sexo==='H'?'on':''}">Hombre</button><button type="button" id="segM" class="${p.sexo==='M'?'on':''}">Mujer</button></div></div>
 <div class="field"><label for="obPeso">Peso <span class="unit">(kg)</span></label><input id="obPeso" type="number" inputmode="decimal" min="30" max="300" step="0.1" placeholder="Ej. 72" value="${p.peso||''}"></div>
 <div class="field"><label for="obAltura">Altura <span class="unit">(cm)</span></label><input id="obAltura" type="number" inputmode="numeric" min="100" max="250" step="1" placeholder="Ej. 170" value="${p.altura||''}"></div>
 <div class="field"><label for="obEdad">Edad <span class="unit">(años)</span></label><input id="obEdad" type="number" inputmode="numeric" min="10" max="100" step="1" placeholder="Ej. 30" value="${p.edad||''}"></div>
 <div class="field"><label for="obMeta">Meta calórica <span class="unit">(kcal/día)</span></label><input id="obMeta" type="number" inputmode="numeric" min="800" max="6000" step="10" placeholder="Se calcula al llenar los datos" value="${p.meta||''}"></div>
 <div class="sugg" id="obSugg">Llena peso, altura, edad y sexo para sugerirte una meta.</div>
 <button class="btn maiz" id="obSave" style="margin-top:18px">${edit?'Guardar cambios':'Empezar 🚀'}</button>
 ${edit?'<button class="btn gh" onclick="home()">Cancelar</button>':''}
 </div>`;
 let sexo=p.sexo;
 document.getElementById('segH').onclick=()=>{sexo='H';document.getElementById('segH').classList.add('on');document.getElementById('segM').classList.remove('on');sug()};
 document.getElementById('segM').onclick=()=>{sexo='M';document.getElementById('segM').classList.add('on');document.getElementById('segH').classList.remove('on');sug()};
 const val=id=>{const v=parseFloat(document.getElementById(id).value);return isFinite(v)&&v>0?v:null};
 const sug=()=>{
  const w=val('obPeso'),a=val('obAltura'),e=val('obEdad'),m=val('obMeta');
  if(!w||!a||!e||!sexo){return}
  const bmr=sexo==='H'?10*w+6.25*a-5*e+5:10*w+6.25*a-5*e-161;   // Mifflin-St Jeor
  const meta=Math.round(bmr*1.4/10)*10;                            // actividad ligera
  const el=document.getElementById('obSugg');

  if(!m)document.getElementById('obMeta').value=meta;
 };

async function startCam(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  return sheet(`<h2>Cámara no disponible</h2><p class="mut">Este navegador no permite usar la cámara aquí. Usa "Subir de galería".</p><button class="btn" onclick="openCam()">Volver</button>`);
 }
 let s;
 try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
 catch(err){return sheet(`<h2>No pudimos acceder a la cámara</h2><p class="mut">Revisa los permisos de cámara del navegador, o usa "Subir de galería".</p><button class="btn" onclick="openCam()">Volver</button>`)}
 camStream=s;
 sheet(`<div style="overflow:hidden;border-radius:18px;background:#000"><video id="vp" autoplay playsinline muted style="width:100%;height:56vh;object-fit:cover;display:block"></video></div>
 <p class="mut" style="text-align:center">Encuadra el plato completo y captura.</p>
 <div style="display:flex;gap:10px;margin-top:6px"><button class="btn gh" onclick="cerrarSheet()">Cancelar</button><button class="btn maiz" id="shoot">📸 Capturar</button></div>`);
 const vp=$('#vp');vp.srcObject=camStream;vp.play().catch(()=>{});
 $('#shoot').onclick=()=>{
  const c=document.createElement('canvas');c.width=vp.videoWidth||1280;c.height=vp.videoHeight||720;
  c.getContext('2d').drawImage(vp,0,0,c.width,c.height);
  cerrarSheet();
  c.toBlob(b=>{if(!b)return sheet(`<h2>No pudimos capturar la foto</h2><button class="btn" onclick="openCam()">Reintentar</button>`);scan(new File([b],'captura.jpg',{type:'image/jpeg'}))},'image/jpeg',0.9);
 };
}
function compress(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const M=768,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const full=c.toDataURL('image/jpeg',.7);const t=document.createElement('canvas');t.width=t.height=96;const x=t.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);URL.revokeObjectURL(u);ok({full,th:t.toDataURL('image/jpeg',.6)})};im.onerror=no;im.src=u})}
const DEMO=[{plato:'Bandeja paisa',porcion:'1 plato grande (~600 g)',calorias:1150,proteina_g:62,carbs_g:98,grasa_g:58,puntaje_salud:3,ingredientes:['frijoles','arroz','chicharrón','carne molida','huevo','plátano maduro','arepa'],consejo:'Comparte el plato o quita el chicharrón para bajar unas 300 kcal.'},{plato:'Arepa con queso',porcion:'1 arepa mediana',calorias:380,proteina_g:14,carbs_g:48,grasa_g:15,puntaje_salud:6,ingredientes:['arepa de maíz','queso'],consejo:'Acompáñala con huevo o fruta para una comida más completa.'},{plato:'Sancocho de gallina',porcion:'1 plato hondo',calorias:520,proteina_g:34,carbs_g:52,grasa_g:19,puntaje_salud:7,ingredientes:['gallina','yuca','papa','plátano verde','mazorca'],consejo:'Buena fuente de proteína. Controla la porción de yuca y papa.'}];
let lastScanAt=0;
async function scan(file){
 if(Date.now()-lastScanAt<5000){return sheet(`<h2>Espera un momento</h2><p class="mut">Solo se permite un escaneo cada 5 segundos.</p><button class="btn" onclick="cerrarSheet()">Entendido</button>`)}
 lastScanAt=Date.now();
 sheet(`<div class="scanov" role="status" aria-live="polite"><div class="scanbox" aria-hidden="true"><div class="plate">🍽️</div><div class="beam"></div></div><p style="text-align:center;font-weight:700;font-size:17px">Analizando tu plato…</p><p class="mut" style="text-align:center">Estimando calorías y macros</p></div>`);
 try{
  const {full,th}=await compress(file);let r;
  if(!API_URL){await new Promise(z=>setTimeout(z,1400));r=DEMO[Math.floor(Math.random()*DEMO.length)]}
  else{const res=await fetch(API_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image:full.split(',')[1],uid:UID,device:S.dev})});
   if(res.status===402){cerrarSheet();S.used=FREE;save();return paywall()}
   r=await res.json();if(!res.ok)throw new Error((r.error||'error')+(r.detalle?(' — '+r.detalle):'')+(r.http?(' [HTTP '+r.http+']'):''))}
  if(r.es_comida===false){sheet(`<h2>No veo comida</h2><p class="mut">Intenta con más luz y el plato completo en la foto.</p><button class="btn" onclick="cerrarSheet()">Entendido</button>`);return}
  S.used++;save();
  result({plato:r.plato,calorias:r.calorias,proteina:r.proteina_g||0,carbos:r.carbs_g||0,grasa:r.grasa_g||0,ingredientes:Array.isArray(r.ingredientes)?r.ingredientes:[]},full,th);
 }catch(e){sheet(`<h2>No pudimos analizar la foto</h2><p class="mut" style="word-break:break-word">${esc(e.message||e||'Error desconocido')}</p><button class="btn" onclick="cerrarSheet()">Cerrar</button>`)}
}
function result(r,img,th){
 const M=META(),mp={prot:M.prot/3,carbs:M.carbs/3,grasa:M.grasa/3};
 sheet(`${img?`<img class="photo" src="${esc(img)}" alt="Tu plato">`:''}<h2 style="font-size:26px">${esc(r.plato)}</h2>
 <div class="rgrid">
  <div class="rmac"><div class="n">Calorías</div><div class="v">${Math.round(r.calorias)}<small> kcal</small></div></div>

  <div class="rmac"><div class="n">Carbos</div><div class="v">${Math.round(r.carbos)}<small> g</small></div><div class="bar"><i style="width:${Math.min(100,Math.round(r.carbos/mp.carbs*100))}%;background:#f59e0b"></i></div></div>
  <div class="rmac"><div class="n">Grasa</div><div class="v">${Math.round(r.grasa)}<small> g</small></div><div class="bar"><i style="width:${Math.min(100,Math.round(r.grasa/mp.grasa*100))}%;background:#10b981"></i></div></div>
 </div>
 ${r.ingredientes&&r.ingredientes.length?`<div class="card"><b>Ingredientes detectados</b><div class="chips">${r.ingredientes.map(i=>`<span class="chip">${esc(i)}</span>`).join('')}</div></div>`:''}
 <p class="mut" style="margin-top:12px">Estimación aproximada. No reemplaza a un nutricionista.</p>
 <button class="btn maiz" id="guardar">Guardar comida</button>
 <button class="btn gh" onclick="cerrarSheet()">← Atrás</button>`);
 $('#guardar').onclick=()=>{SCANS.unshift({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),timestamp:Date.now(),plato:r.plato,calorias:Math.round(r.calorias),proteina:Math.round(r.proteina),carbos:Math.round(r.carbos),grasa:Math.round(r.grasa),foto:img,th:th,ingredientes:r.ingredientes||[]});saveScans();cerrarSheet();home();toast('Comida guardada ✅')};
 $('#guardar').focus();
}

// Inicializa Firebase y obtiene un uid anónimo. Si Firebase no carga (offline o

(function iniciarAuth(){
